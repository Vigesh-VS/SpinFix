# SPDX-License-Identifier: MIT
# Builds a release from a version tag (v0.1.0): tests → PyInstaller → Inno Setup →
# (code signing when configured) → SHA-256 checksums → DRAFT GitHub release.
# Vigesh reviews the draft and publishes it himself.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write  # create the draft release
    env:
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install locked dependencies (hash-checked)
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-dev.lock

      - name: Check the tag matches the app version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $ver = python -c "import spinfix; print(spinfix.__version__)"
          if ($tag -ne $ver) { throw "Tag $tag does not match spinfix.__version__ $ver" }
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Tests
        run: pytest -q

      - name: Build app (PyInstaller, one folder, no UPX)
        run: pyinstaller --noconfirm --clean packaging/spinfix.spec

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; }
          & $iscc "/DAppVersion=$env:VERSION" installer\spinfix.iss

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\Spinfix\* -DestinationPath "installer\Output\Spinfix-$env:VERSION-portable.zip"

      # Code signing (SignPath Foundation). Enabled once Vigesh adds the repository
      # secrets SIGNPATH_API_TOKEN and SIGNPATH_ORGANIZATION_ID and the project is approved.
      - name: Code signing
        if: env.HAS_SIGNPATH == 'true'
        shell: pwsh
        run: Write-Host "Configure the SignPath signing step here once the project is approved."

      - name: SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem installer\Output -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Out-File -FilePath installer\Output\SHA256SUMS.txt -Encoding ascii

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" --draft --verify-tag `
            --title "Spinfix $env:VERSION" --notes-file CHANGELOG.md `
            (Get-ChildItem installer\Output -File).FullName
