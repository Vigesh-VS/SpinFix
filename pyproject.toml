[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "spinfix"
dynamic = ["version"]
description = "Drag a file, press Shift, drop it on a wheel: convert, compress or fix it offline."
readme = "docs/DOCUMENTATION.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vigesh", email = "154797502+Vigesh-VS@users.noreply.github.com" }]
requires-python = ">=3.12,<3.13"
dependencies = []
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/Vigesh-VS/SpinFix"
Issues = "https://github.com/Vigesh-VS/SpinFix/issues"

[project.scripts]
spinfix = "spinfix.cli:main"

[tool.setuptools.dynamic]
version = { attr = "spinfix.__version__" }

[tool.setuptools.packages.find]
include = ["spinfix*"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "SIM", "RUF", "PTH", "C4", "PL",
]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pickle".msg = "Never unpickle data (CLAUDE.md §5)."
"marshal".msg = "Never unmarshal data (CLAUDE.md §5)."
"shelve".msg = "Uses pickle (CLAUDE.md §5)."

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
files = ["spinfix", "tests", "scripts"]
warn_unused_configs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["spinfix.core", "spinfix.core.*"]
strict = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

# ---------------------------------------------------------------- bandit
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
